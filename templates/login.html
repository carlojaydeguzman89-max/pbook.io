{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 30px auto;">
    <h2 style="color: var(--accent-gold); margin-bottom: 20px; text-align: center;">🔑 Member Login</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label style="color: var(--text-muted);">Mobile Number (or Admin Name)</label>
            <input type="text" name="login_input" required placeholder="e.g. 09171234567 or admin" style="margin-top: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="color: var(--text-muted);">Philippine SIM / Telco Network</label>
            <select name="network" style="margin-top: 5px;">
                {% for net in networks %}
                    <option value="{{ net }}">{{ net }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="color: var(--text-muted);">Password</label>
            <div style="display: flex; gap: 6px; margin-top: 5px;">
                <input type="password" id="loginPass" name="password" required placeholder="Enter password" style="flex: 1;">
                <button type="button" onclick="togglePassword('loginPass', this)" class="btn btn-ignore" style="padding: 0 12px; font-size: 0.9rem;">👁️ Show</button>
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 1rem;">Log In</button>
    </form>

    <div style="text-align: center; margin-top: 20px; border-top: 1px solid var(--card-border); padding-top: 15px;">
        <span style="color: var(--text-muted); font-size: 0.9rem;">Don't have an account yet?</span><br>
        <a href="{{ url_for('register') }}" style="color: var(--accent-gold); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 5px;">Create New Account ➔</a>
    </div>
</div>

<script>
function togglePassword(inputId, btn) {
    const passInput = document.getElementById(inputId);
    if (passInput.type === 'password') {
        passInput.type = 'text';
        btn.innerText = '🙈 Hide';
    } else {
        passInput.type = 'password';
        btn.innerText = '👁️ Show';
    }
}
</script>
{% endblock %}
