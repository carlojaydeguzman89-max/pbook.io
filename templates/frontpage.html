{% extends "base.html" %}
{% block content %}
<div class="card" style="text-align: center; padding: 60px 20px;">
    <h1 style="color: var(--accent-gold); margin-bottom: 15px; font-size: 2.2rem;">Welcome to Phone Book Manager</h1>
    <p style="color: var(--text-muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 35px auto;">
        A simple, fast, and secure directory manager for storing and organizing your personal telephone and mobile contact records.
    </p>
    <div>
        <a href="{{ url_for('login') }}" class="btn" style="padding: 14px 36px; font-size: 1.1rem; text-decoration: none; border-radius: 30px;">
            Get Started ➔
        </a>
    </div>
</div>
{% endblock %}
