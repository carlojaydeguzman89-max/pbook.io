<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Book Manager</title>
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --card-border: #334155;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-gold: #F59E0B;
            --input-bg: #0F172A;
            --btn-main: #D97706;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .navbar a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn {
            background: var(--btn-main);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            text-align: center;
        }

        .btn-danger { background: #EF4444; }
        .btn-ignore { background: #475569; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        th { color: var(--accent-gold); }

        .alert {
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .alert-danger { background: #7F1D1D; color: #FECACA; }
        .alert-success { background: #064E3B; color: #A7F3D0; }
        .alert-warning { background: #78350F; color: #FDE68A; }
        .alert-info { background: #1E3A8A; color: #BFDBFE; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="{{ url_for('frontpage') }}" style="font-size: 1.2rem; color: var(--accent-gold);">📖 Phone Book Manager</a>
            <div>
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('dashboard') }}" style="margin-right: 15px;">Dashboard</a>
                    <a href="{{ url_for('logout') }}" style="color: #EF4444;">Logout</a>
                {% endif %}
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
